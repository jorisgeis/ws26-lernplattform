<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyOS · Lern-Chat</title>
  <meta name="description" content="Lern-Chat mit Studi-Bot: Karteikarten, Quiz, Kurse, E-Mail-Coach und Spickzettel für WS 26/27.">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0d" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Lern-Chat">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="../shared/diagrams.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply theme before first paint: shared store key, otherwise the system preference.
    (function () {
      var t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      try {
        var raw = localStorage.getItem('ws26_lernplattform_v1');
        if (raw) t = JSON.parse(raw).theme === 'light' ? 'light' : 'dark';
      } catch (e) { /* keep system theme */ }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="app" id="app">
    <aside class="side" id="side" aria-label="Unterhaltungen"></aside>

    <main class="chat" id="chat">
      <header class="chat-head">
        <button class="icon-btn only-phone" type="button" data-act="nav" data-arg="menu" aria-label="Unterhaltungen öffnen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <span class="dot-badge" id="menu-badge" hidden></span>
        </button>
        <button class="peer" type="button" data-act="nav" data-arg="heute" aria-label="Heute & Statistik öffnen">
          <span class="avatar bot" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 4c-4.4 0-8 2.8-8 6.3 0 2 1.1 3.7 2.8 4.9-.2 1.3-.8 2.4-1.8 3.3 1.8-.1 3.4-.7 4.7-1.6.7.1 1.5.2 2.3.2 4.4 0 8-2.8 8-6.3S16.4 4 12 4z"/></svg></span>
          <span class="peer-text"><strong>Studi-Bot</strong><small id="peer-sub">online</small></span>
        </button>
        <div class="head-actions">
          <button class="pomo-pill" type="button" id="pomo-pill" data-act="pomo-toggle" aria-label="Pomodoro starten oder pausieren">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.4 1.6M10 2.8h4"/></svg>
            <span data-pomo-time>25:00</span>
          </button>
          <button class="icon-btn hide-phone" type="button" data-act="theme" aria-label="Hell/Dunkel umschalten">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
          </button>
          <button class="icon-btn hide-phone" type="button" data-act="clear-chat" aria-label="Verlauf leeren">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V4.5h4V7M7 7l1 13h8l1-13"/></svg>
          </button>
          <button class="icon-btn" type="button" data-act="nav" data-arg="heute" aria-label="Heute & Statistik">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
          </button>
        </div>
      </header>

      <div class="thread" id="thread" role="log" aria-live="polite" aria-label="Chatverlauf"></div>

      <div class="dock" id="dock">
        <div class="chips" id="chips" role="toolbar" aria-label="Schnellantworten"></div>
        <form class="composer" id="composer" autocomplete="off">
          <label class="sr-only" for="input">Nachricht an Studi-Bot</label>
          <textarea id="input" rows="1" placeholder="Nachricht … z. B. „quiz gp1“" enterkeyhint="send" autocapitalize="off" spellcheck="false"></textarea>
          <button class="send" type="submit" aria-label="Senden">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
          </button>
        </form>
      </div>
    </main>

    <section class="panel" id="panel" aria-label="Seitenbereich">
      <header class="panel-head">
        <button class="icon-btn panel-close" type="button" data-act="close" aria-label="Schließen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <h2 id="panel-title">Heute</h2>
        <div class="panel-tools" id="panel-tools"></div>
      </header>
      <div class="panel-body" id="panel-body"></div>
    </section>

    <div class="scrim" id="scrim" data-act="close" aria-hidden="true"></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  </div>

  <div class="print-sheet" id="print-sheet" aria-hidden="true"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script type="module" src="app.js"></script>
</body>
</html>

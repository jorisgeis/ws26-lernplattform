<!doctype html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyOS · Stories</title>
  <meta name="description" content="StudyOS WS 26/27 – Lernen in Story-Häppchen: Kapitel als Stories, Karteikarten, Quiz und mehr.">
  <meta name="theme-color" content="#0a0a10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f4fa" media="(prefers-color-scheme: light)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stories">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="../shared/diagrams.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the theme before first paint (shared store key); without stored state follow the OS.
    (function () {
      var theme = 'dark';
      try {
        var raw = localStorage.getItem('ws26_lernplattform_v1');
        if (raw) theme = JSON.parse(raw).theme === 'light' ? 'light' : 'dark';
        else if (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
      } catch (e) { /* keep dark */ }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
</head>
<body data-route="home">
  <a class="skip" href="#view">Zum Inhalt springen</a>

  <div class="app" id="app">
    <!-- Desktop: left column (nav + story rings) -->
    <aside class="side" aria-label="Navigation">
      <a class="brand" href="#/" aria-label="StudyOS Stories – Start">
        <span class="brand-logo" aria-hidden="true"><i></i></span>
        <span class="brand-text"><b>Stories</b><small>StudyOS · WS 26/27</small></span>
      </a>
      <nav class="side-nav" aria-label="Hauptnavigation">
        <a href="#/" data-nav="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3.6 2.2"/><circle cx="12" cy="12" r="4.6"/></svg><span>Stories &amp; Heute</span><kbd>H</kbd></a>
        <a href="#/karten" data-nav="karten"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="14" rx="3"/><path d="M8 3h10a3 3 0 0 1 3 3v11"/></svg><span>Karteikarten</span><b class="badge" data-badge="due"></b><kbd>K</kbd></a>
        <a href="#/quiz" data-nav="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4"/><path d="M12 16.8v.2"/></svg><span>Quiz</span><kbd>Q</kbd></a>
        <a href="#/kurse" data-nav="kurse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/></svg><span>Kurse</span><kbd>C</kbd></a>
        <a href="#/email" data-nav="email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg><span>E-Mail-Coach</span><kbd>E</kbd></a>
        <a href="#/blatt" data-nav="blatt"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span>Spickzettel</span><b class="badge" data-badge="pins"></b><kbd>S</kbd></a>
        <a href="#/methode" data-nav="methode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.7.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.4-1.6 1.1-2.1A6 6 0 0 0 12 3z"/></svg><span>Methode &amp; Backup</span><kbd>M</kbd></a>
      </nav>
      <div class="side-stories">
        <p class="side-label">Kapitel-Stories <span id="side-new"></span></p>
        <div id="side-stories" class="side-list"></div>
      </div>
      <div class="side-foot">
        <div class="side-pomo">
          <button class="pomo-mini" type="button" data-act="pomo-toggle" aria-label="Fokus-Timer starten oder pausieren">
            <span class="pomo-ring" data-pomo="ring" aria-hidden="true"></span>
            <span class="pomo-mini-txt"><b data-pomo="time">25:00</b><small data-pomo="state">Fokus · bereit</small></span>
          </button>
          <button class="icon-btn" type="button" data-act="pomo-reset" aria-label="Timer zurücksetzen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/></svg></button>
          <button class="icon-btn" type="button" data-act="pomo-mode" aria-label="Zwischen 25 und 50 Minuten wechseln"><span data-pomo="modeShort">25</span></button>
        </div>
        <button class="theme-btn" type="button" data-act="theme" aria-label="Hell-/Dunkelmodus wechseln">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
          <span class="theme-label"></span>
        </button>
        <button class="link-btn" type="button" data-act="shortcuts">Tastenkürzel <kbd>?</kbd></button>
      </div>
    </aside>

    <!-- Phone/tablet: top bar -->
    <header class="topbar">
      <a class="brand" href="#/" aria-label="StudyOS Stories – Start">
        <span class="brand-logo" aria-hidden="true"><i></i></span>
        <span class="brand-text"><b>Stories</b></span>
      </a>
      <div class="topbar-tools">
        <button class="pomo-chip" type="button" data-act="pomo-sheet" aria-label="Fokus-Timer öffnen">
          <span class="pomo-dot" aria-hidden="true"></span><span data-pomo="time">25:00</span>
        </button>
        <button class="icon-btn theme-btn-sm" type="button" data-act="theme" aria-label="Hell-/Dunkelmodus wechseln">
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        </button>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <!-- Story player: centre column on desktop, full-screen overlay on phones -->
    <section class="stage" id="stage" aria-label="Story-Player"></section>

    <!-- Phone/tablet: bottom tab bar -->
    <nav class="tabbar" aria-label="Hauptnavigation">
      <a href="#/" data-tab="home"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke-dasharray="3.6 2.2"/><circle cx="12" cy="12" r="4.6"/></svg><span>Stories</span></a>
      <a href="#/karten" data-tab="karten"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="14" rx="3"/><path d="M8 3h10a3 3 0 0 1 3 3v11"/></svg><span>Karten</span><b class="badge" data-badge="due"></b></a>
      <a href="#/quiz" data-tab="quiz"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4"/><path d="M12 16.8v.2"/></svg><span>Quiz</span></a>
      <a href="#/kurse" data-tab="kurse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5z"/><path d="M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5"/></svg><span>Kurse</span></a>
      <button type="button" data-tab="mehr" data-act="more"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="2"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="2"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="2"/></svg><span>Mehr</span><b class="badge" data-badge="pins"></b></button>
    </nav>
  </div>

  <!-- Bottom sheet (phone) / dialog (desktop) -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" data-act="sheet-close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grip" aria-hidden="true"></div>
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button class="icon-btn" type="button" data-act="sheet-close" aria-label="Schließen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="print-sheet" id="print-sheet" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  </script>
</body>
</html>

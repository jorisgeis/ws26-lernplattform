<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>StudyOS WS26 · Bento Glass</title>
  <link rel="stylesheet" href="../shared/diagrams.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mesh" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
  </div>

  <header class="menubar glass" id="menubar"></header>

  <main class="stage" id="app" tabindex="-1"></main>

  <nav class="dock-wrap" aria-label="Hauptnavigation">
    <div class="dock glass" id="dock"></div>
  </nav>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <!-- Filled right before printing; the only element visible in @media print -->
  <section id="print-sheet" aria-hidden="true"></section>

  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="de" data-theme="paper">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyOS · Zen</title>
  <link rel="stylesheet" href="../shared/diagrams.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the stored theme before first paint (same localStorage key as the shared store).
    try {
      var s = JSON.parse(localStorage.getItem('ws26_lernplattform_v1') || '{}');
      document.documentElement.dataset.theme = (s.theme || 'dark') === 'dark' ? 'night' : 'paper';
    } catch (e) { /* keep default */ }
  </script>
</head>
<body>
  <a class="skip" href="#view">Zum Inhalt springen</a>

  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="#/heute" aria-label="StudyOS – Heute">
        <span class="wm-name">StudyOS</span><span class="wm-sub">WS 26/27</span>
      </a>

      <nav class="topnav" id="topnav" aria-label="Hauptnavigation">
        <a href="#/heute" data-view="heute">Heute</a>
        <a href="#/karten" data-view="karten">Karten<sup class="nav-count" id="nav-due"></sup></a>
        <a href="#/quiz" data-view="quiz">Quiz</a>
        <a href="#/kurse" data-view="kurse">Kurse</a>
        <a href="#/email" data-view="email">E-Mail</a>
        <a href="#/blatt" data-view="blatt">Spickzettel<sup class="nav-count" id="nav-pins"></sup></a>
        <a href="#/methode" data-view="methode">Methode</a>
      </nav>

      <div class="tools">
        <button class="tool tool-search" type="button" data-act="palette" aria-label="Befehlspalette öffnen">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
          <span class="tool-label">Suchen</span><kbd id="kbd-k">⌘K</kbd>
        </button>
        <button class="tool tool-theme" type="button" data-act="theme" aria-label="Tag- und Nachtmodus wechseln">
          <svg class="ico-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 12.5A6.5 6.5 0 0 1 7.5 4a6.5 6.5 0 1 0 8.5 8.5z"/></svg>
          <svg class="ico-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"/></svg>
        </button>
        <div class="pomo" id="pomo">
          <button class="pomo-chip" type="button" data-act="pomo-chip" aria-expanded="false" aria-controls="pomo-pop" title="Fokus-Timer">
            <span class="pomo-dot" aria-hidden="true"></span><span id="pomo-chip-time">25:00</span>
          </button>
          <div class="pomo-pop" id="pomo-pop" hidden>
            <p class="eyebrow">Fokus-Timer</p>
            <p class="pomo-time" id="pomo-time">25:00</p>
            <div class="pomo-track"><i id="pomo-bar"></i></div>
            <p class="pomo-mode" id="pomo-mode-label">Pomodoro · 25 Minuten</p>
            <div class="pomo-actions">
              <button class="btn primary" type="button" data-act="pomo-toggle" id="pomo-toggle">Starten</button>
              <button class="btn" type="button" data-act="pomo-reset">Zurücksetzen</button>
            </div>
            <button class="link" type="button" data-act="pomo-mode" id="pomo-mode-btn">Auf 50 Minuten wechseln</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div class="palette" id="palette" hidden>
    <div class="palette-backdrop" data-act="palette-close"></div>
    <div class="palette-panel" role="dialog" aria-modal="true" aria-label="Befehlspalette">
      <div class="palette-field">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4.5 4.5"/></svg>
        <input id="palette-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Wohin möchtest du? Ansicht, Kurs, Kapitel, Aktion …"
               role="combobox" aria-expanded="true" aria-controls="palette-list">
      </div>
      <ul class="palette-list" id="palette-list" role="listbox"></ul>
      <footer class="palette-foot">
        <span><kbd>↑</kbd><kbd>↓</kbd> wählen</span>
        <span><kbd>↵</kbd> öffnen</span>
        <span><kbd>esc</kbd> schließen</span>
      </footer>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="print-sheet" id="print-sheet" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
</body>
</html>

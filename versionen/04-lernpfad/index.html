<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <title>Lernpfad · StudyOS WS26</title>
  <link rel="stylesheet" href="../shared/diagrams.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stage">
    <div class="app" id="app">
      <header class="top" id="top"></header>
      <main class="screen" id="screen" tabindex="-1"></main>
      <nav class="tabbar" id="tabbar" aria-label="Hauptnavigation"></nav>
      <div class="sheet-layer" id="sheet-layer" hidden>
        <div class="sheet-backdrop" data-action="close-sheet"></div>
        <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Details"></section>
      </div>
      <div class="toasts" id="toasts" aria-live="polite"></div>
      <div class="burst-layer" id="burst" aria-hidden="true"></div>
    </div>
    <aside class="side" id="side" aria-label="Übersicht"></aside>
  </div>
  <div class="print-root" id="print-root"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyOS · Schreibtisch</title>
  <meta name="description" content="StudyOS WS 26/27 – Lernplattform als Schreibtisch: Karteikasten, Klausurbogen, Kursordner, Briefblock und Spickzettel.">
  <meta name="theme-color" content="#b98a55" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d130b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Schreibtisch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="../shared/diagrams.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the stored theme before first paint (same localStorage key as the shared store);
    // without stored progress, follow the system setting.
    (function () {
      var t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      try {
        var raw = localStorage.getItem('ws26_lernplattform_v1');
        if (raw) t = JSON.parse(raw).theme === 'light' ? 'light' : 'dark';
      } catch (e) { /* keep system default */ }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt springen</a>
  <div class="app">
    <aside class="drawer" id="drawer" aria-label="Schublade" hidden></aside>
    <header class="topbar" id="topbar" hidden></header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>
  <nav class="shelf" id="shelf" aria-label="Regal"></nav>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>

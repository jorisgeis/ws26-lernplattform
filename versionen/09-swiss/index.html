<!doctype html>
<html lang="de" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>StudyOS · Swiss Data Cockpit</title>
  <meta name="description" content="StudyOS WS 26/27 – Lern-Cockpit im Internationalen Typografischen Stil.">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0b0b" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="StudyOS 09">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="../shared/diagrams.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Theme before first paint. Same localStorage key as the shared store.
    // No saved state yet → follow the system (light unless the OS is dark).
    try {
      var raw = localStorage.getItem('ws26_lernplattform_v1');
      var t = raw ? (JSON.parse(raw).theme || 'dark')
        : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';
    } catch (e) { /* keep light */ }
  </script>
</head>
<body>
  <a class="skip" href="#view">Zum Inhalt springen</a>

  <div class="shell">
    <header class="index" id="index">
      <div class="brand-row">
        <a class="brand" href="#/uebersicht" aria-label="StudyOS – Übersicht">
          <span class="brand-name">StudyOS</span>
          <span class="brand-sub">WS 26/27 · Data Cockpit</span>
        </a>
        <div class="tools">
          <button class="pomo-chip" type="button" data-act="pomo-open" aria-expanded="false" aria-controls="pomo">
            <span class="pomo-dot" aria-hidden="true"></span><span id="pomo-chip-time">25:00</span>
            <span class="sr">Fokus-Timer öffnen</span>
          </button>
          <button class="theme-btn" type="button" data-act="theme" aria-label="Hell- und Dunkelmodus wechseln">
            <span class="tb-l">Hell</span><span class="tb-sep" aria-hidden="true">/</span><span class="tb-d">Dunkel</span>
          </button>
        </div>
      </div>

      <nav class="sections" id="sections" aria-label="Abschnitte"></nav>

      <section class="pomo" id="pomo" aria-label="Fokus-Timer">
        <p class="label">Fokus-Timer · <span id="pomo-mode">25 Min</span></p>
        <p class="pomo-time" id="pomo-time">25:00</p>
        <div class="pomo-track" aria-hidden="true"><i id="pomo-bar"></i></div>
        <div class="pomo-acts">
          <button class="btn btn-primary" type="button" data-act="pomo-toggle" id="pomo-toggle">Start</button>
          <button class="btn" type="button" data-act="pomo-reset">Reset</button>
          <button class="btn" type="button" data-act="pomo-mode" id="pomo-mode-btn" aria-label="Auf 50 Minuten wechseln">50</button>
        </div>
      </section>

      <p class="index-foot kbd-only"><kbd>⌥1–7</kbd> Abschnitte<br><kbd>T</kbd> Hell/Dunkel · <kbd>P</kbd> Timer</p>
    </header>

    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div class="print-sheet" id="print-sheet" aria-hidden="true"></div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch(() => {});
  </script>
</body>
</html>
